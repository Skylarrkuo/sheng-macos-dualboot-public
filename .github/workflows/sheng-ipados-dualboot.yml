name: sheng iPadOS dual boot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  images:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      UNIXNU_IPSW_JOBS: 16
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check the device Secret
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if [[ ! $UNIXNU_UNIQUE_CHIP_ID =~ ^[a-fA-F0-9]{16}$ ||
                $UNIXNU_UNIQUE_CHIP_ID == 0000000000000000 ]]; then
            printf 'Configure the full CPUID in the repository Secret.\n' >&2
            exit 1
          fi
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Install the UniXNU build tools
        id: tools
        run: |
          df -h "$RUNNER_TEMP"
          workspace="$RUNNER_TEMP/sheng-ipados"
          {
            echo "BUILD_WORKSPACE=$workspace"
            echo "IPADOS_TREE=$workspace/UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree"
          } >> "$GITHUB_ENV"
          brew install dtc llvm lld llvm@22 lld@22 cmake mtools ninja glslang shaderc \
            spirv-tools bison pkgconf rustup unifdef openssl@3 zstd blacktop/tap/ipsw
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          {
            echo "$HOME/.cargo/bin"
            echo "$(brew --prefix bison)/bin"
          } >> "$GITHUB_PATH"
          fingerprint=$({
            sw_vers -buildVersion
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            python3 --version
            rustup run 1.98.0 rustc --version
            brew list --versions llvm bison glslang ninja
          } | shasum -a 256)
          echo "fingerprint=${fingerprint%% *}" >> "$GITHUB_OUTPUT"
      - name: Prepare the pinned source checkouts
        run: bash prepare-sources.sh "$BUILD_WORKSPACE"
      - name: Restore the device-independent GPU builds
        uses: actions/cache/restore@v6.1.0
        id: gpu-cache
        with:
          path: |
            ${{ env.IPADOS_TREE }}/build/adreno-metal-bridge/ios27/libadreno_metal_bridge.a
            ${{ env.IPADOS_TREE }}/build/adreno-metal-bridge/ios27/libadreno_metal_bridge.a.json
            ${{ env.IPADOS_TREE }}/build/mesa-tu-ios27/src/freedreno/vulkan/libvulkan_freedreno.dylib
            ${{ env.IPADOS_TREE }}/build/mesa-tu-ios27/qualified-ios27.json
          key: ipados27-gpu-v1-${{ runner.arch }}-${{ steps.tools.outputs.fingerprint }}-${{ hashFiles('prepare-sources.sh', 'patches/ipados-compile-cache.patch', 'patches/ipados-metal-bridge.patch', 'patches/metal2vulkan-ios-mach-vm.patch') }}
      - name: Restore the XNU comparison kernel
        uses: actions/cache/restore@v6.1.0
        id: reference-cache
        with:
          path: |
            ${{ env.IPADOS_TREE }}/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf
            ${{ env.IPADOS_TREE }}/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.json
          key: ipados27-reference-v1-${{ runner.arch }}-${{ steps.tools.outputs.fingerprint }}-${{ hashFiles('prepare-sources.sh', 'ipados-linux.toml', 'patches/ipados-compile-cache.patch', 'patches/ipados-startup-log.patch', 'patches/core.patch') }}
      - name: Build iPadOS boot image and Linux-partition root image
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          log="$RUNNER_TEMP/ipados-build.log"
          status=0
          bash build-ipados.sh "$BUILD_WORKSPACE" >"$log" 2>&1 || status=$?
          grep -E '^== Build timing [a-z-]+: [0-9]+s$' "$log" || true
          if (( status != 0 )); then
            printf 'Build failed. See the diagnostic draft.\n' >&2
            exit "$status"
          fi
      - name: Check which caches the build produced
        id: cache-outputs
        if: ${{ !cancelled() }}
        run: |
          if [[ -s $IPADOS_TREE/build/adreno-metal-bridge/ios27/libadreno_metal_bridge.a &&
                -s $IPADOS_TREE/build/adreno-metal-bridge/ios27/libadreno_metal_bridge.a.json &&
                -s $IPADOS_TREE/build/mesa-tu-ios27/src/freedreno/vulkan/libvulkan_freedreno.dylib &&
                -s $IPADOS_TREE/build/mesa-tu-ios27/qualified-ios27.json ]]; then
            echo 'gpu=yes' >> "$GITHUB_OUTPUT"
          fi
          reference="$IPADOS_TREE/build/xnu/fileset-reference/mach.release.bcm2837.unstripped"
          if [[ -s $reference.noctf && -s $reference.json ]]; then
            echo 'reference=yes' >> "$GITHUB_OUTPUT"
          fi
          grep -h -E '^(PASS: reused qualified Turnip library for ios27|PASS: reused unchanged ios27 Rust bridge from component [a-f0-9]+; frontend component [a-f0-9]+|reference inputs and digest match \(lto\): .*)$' \
            "$IPADOS_TREE/../logs/runtime.log" "$IPADOS_TREE/../logs/"archive-*-build-fileset-release-reference.log 2>/dev/null || true
      - name: Save the device-independent GPU builds
        if: ${{ !cancelled() && steps.cache-outputs.outputs.gpu == 'yes' && steps.gpu-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ${{ env.IPADOS_TREE }}/build/adreno-metal-bridge/ios27/libadreno_metal_bridge.a
            ${{ env.IPADOS_TREE }}/build/adreno-metal-bridge/ios27/libadreno_metal_bridge.a.json
            ${{ env.IPADOS_TREE }}/build/mesa-tu-ios27/src/freedreno/vulkan/libvulkan_freedreno.dylib
            ${{ env.IPADOS_TREE }}/build/mesa-tu-ios27/qualified-ios27.json
          key: ${{ steps.gpu-cache.outputs.cache-primary-key }}
      - name: Save the XNU comparison kernel
        if: ${{ !cancelled() && steps.cache-outputs.outputs.reference == 'yes' && steps.reference-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ${{ env.IPADOS_TREE }}/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf
            ${{ env.IPADOS_TREE }}/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.json
          key: ${{ steps.reference-cache.outputs.cache-primary-key }}
      - name: Package and verify the release files
        run: |
          set -o pipefail
          target="$BUILD_WORKSPACE/UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27"
          mkdir artifacts
          cp "$target/boot/boot.img" "$target/package.manifest.json" \
            "$target/runtime/data.dbr" "$target/userdata/unixnu-root.json" artifacts/
          zstd -T0 -3 -c "$target/userdata/unixnu-root.img" \
            | split -b 1024m -a 3 - artifacts/unixnu-root.img.zst.part-
          cd artifacts
          expected=$(python3 -c 'import json; print(json.load(open("unixnu-root.json"))["image_sha256"])')
          actual=$(cat unixnu-root.img.zst.part-* | zstd -dc | shasum -a 256)
          if [[ ${actual%% *} != "$expected" ]]; then
            printf 'Root image checksum differs after joining and decompressing the parts.\n' >&2
            exit 1
          fi
          shasum -a 256 boot.img data.dbr unixnu-root.json package.manifest.json \
            unixnu-root.img.zst.part-* > SHA256SUMS
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = json.loads(Path('unixnu-root.json').read_text())
          print(f"Boot image: {Path('boot.img').stat().st_size} bytes")
          print(f"Root image: {root['image_bytes']} bytes, partition: {root['target_partition']}")
          print(f"Required capacity: {root['storage_required_bytes']} of {root['userdata_bytes']} bytes")
          PY
      - name: Save the images as a Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sheng-ipados27-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash save-ipados-draft.sh "$tag" "sheng iPadOS 27.0.1 (24A446), run ${GITHUB_RUN_NUMBER}" \
            "The root image targets the existing linux partition. Join the .zst.part-* files in filename order, decompress with zstd, and compare the raw SHA-256 with unixnu-root.json. Use boot.img and data.dbr from this draft." \
            artifacts/*
      - name: Save a diagnostic draft for a failed build
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - "$RUNNER_TEMP/ipados-build.log" "$BUILD_WORKSPACE" <<'PY'
          import os
          from pathlib import Path
          import re
          import sys
          seed = os.environ['UNIXNU_UNIQUE_CHIP_ID']
          target = Path(sys.argv[2]) / 'UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27'
          logs = {'ipados-build.log': Path(sys.argv[1]),
                  'runtime.log': target / 'logs/runtime.log',
                  'metal-bridge.log': target / 'tree/build/adreno-metal-bridge/build-ios27.log'}
          for name in ('kernel-bootstrap.log', 'kernel.log', 'prelink.log'):
              logs[name] = target / 'logs' / name
          for source in (target / 'logs').glob('archive-*.log'):
              logs[source.name] = source
          output = Path('diagnostics')
          output.mkdir()
          for name, source in logs.items():
              if source.is_file():
                  log = source.read_text(errors='replace')
                  redacted = re.sub(re.escape(seed), '<device-seed>', log, flags=re.IGNORECASE)
                  (output / name).write_text(redacted)
                  if name == 'ipados-build.log':
                      errors = [line for line in redacted.splitlines() if len(line) < 500
                                and re.search(r'^(unixnu:|[\w.]+Error:)|:\d+:\d+: (fatal )?error:', line)]
                      for error in errors[-10:]:
                          print(re.sub(r'(?i)\b[\da-f]{16}\b', '<hex16>', error))
          PY
          bash save-ipados-draft.sh "sheng-ipados27-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-diagnostic" \
            "sheng iPadOS failed build ${GITHUB_RUN_NUMBER}" \
            "Build diagnostics with the device seed redacted." diagnostics/*.log
